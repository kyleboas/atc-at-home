<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>atcscope · KSFO</title>
<style>
  :root { color-scheme:dark;
          --bg:#1c1c1e; --line:#38383a; --rule:#636366; --fg:#f2f2f7; --fg2:#c7c7cc; --dim:#98989f; --acc:#d1d1d6; --acc2:#8e8e93;
          --card:#2c2c2e; --elev:#2c2c2e; --bd:#48484a; --inbd:#636366; --soft:#3a3a3c; --alt:#232325;
          --accbg:#48484a; --hov:#5a5a5e; --link:#7aa2ff; --action-ink:#60b8f5;
          --bad:#ff6961; --badbg:#4a2020; --warn:#e0b341; --ok:#6ee36e;
          --gnd:#8b949e; --twr:#3fb950; --app:#f0883e; --dep:#58a6ff; --ctr:#bc8cff;
          --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
          --mono:ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.2 var(--sans); -webkit-font-smoothing:antialiased;
         display:grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr; height:100vh; height:100dvh; overflow:hidden;
         -webkit-user-select:none; user-select:none; }
  header { grid-column:1/3; display:flex; flex-wrap:nowrap; gap:2px; white-space:nowrap; overflow:hidden; align-items:center; padding:4px 10px;
           border-bottom:1px solid var(--line); font:12px var(--mono); color:var(--dim); }
  button.q { background:none; border:0; color:var(--dim); font:13px var(--mono); padding:4px 8px; border-radius:4px; }
  button.q:hover { color:var(--fg); background:var(--alt); }
  header b { color:var(--fg); }
  #title { font-size:15px; font-weight:700; color:var(--fg); }
  #clock { font:600 14px var(--mono); color:var(--fg); margin-right:6px; }
  .muted { color:var(--dim); }
  button { background:var(--accbg); color:#fff; border:0; border-radius:4px; padding:5px 10px; cursor:pointer; font:inherit; font-size:13px; }
  button:hover { background:var(--hov); }
  button.g { background:var(--elev); color:var(--fg); border:1px solid var(--bd); }
  button.g:hover { background:var(--hov); }
  button.primary { background:#2f6fde; }
  button.primary:hover { background:#3d7cf0; }
  .lf-seg { display:inline-flex; border:1px solid var(--bd); border-radius:4px; overflow:hidden; }
  .lf-seg button { background:var(--bg); color:var(--fg); border:0; border-radius:0; border-right:1px solid var(--bd); padding:5px 10px; }
  .lf-seg button:last-child { border-right:0; }
  .lf-seg button.on { background:var(--soft); }
  #wrap { position:relative; min-height:0; background:#000; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; touch-action:none; cursor:default; -webkit-touch-callout:none; }
  #side { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .bar { flex-shrink:0; padding:7px 10px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  h3 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; }
  #calls { flex-shrink:0; max-height:35%; overflow:auto; border-bottom:1px solid var(--line); }
  #calls:empty { display:none; }
  .call { display:flex; gap:8px; padding:6px 10px; cursor:pointer; font-size:12px; align-items:baseline; }
  .call:hover { background:var(--alt); }
  .call .cs { font:600 12px var(--mono); min-width:64px; }
  .call .what { flex:1; color:var(--fg2); }
  .call .age { font:12px var(--mono); color:var(--dim); }
  .call.late .age { color:var(--warn); }
  .call.emer { background:var(--badbg); } .call.emer .what { color:var(--bad); }
  #nocalls { padding:8px 10px; color:var(--dim); }
  #selcard { flex-shrink:0; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; line-height:1.45; display:none; background:var(--card); }
  #log { overflow:auto; flex:1; padding:6px 0; font:11px/1.45 var(--mono); color:var(--fg2); -webkit-user-select:text; user-select:text; }
  .row { padding:1px 10px; white-space:pre-wrap; }
  .row .t { color:var(--dim); }
  .GND .who { color:var(--gnd); } .TWR .who { color:var(--twr); } .APP .who { color:var(--app); } .DEP .who { color:var(--dep); } .CTR .who { color:var(--ctr); }
  .row.me .who::after { content:'★'; color:var(--fg); margin-left:-1ch; }
  .row.hard { color:var(--bad); } .row.rule { color:var(--warn); } .row.service { color:var(--dim); }
  .row.invalid, .row.error { color:var(--bad); }
  .row.pilot { color:var(--fg2); }
  #score { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; padding-left:10px; }
  #score .bad { color:var(--bad); }
  #score b.bad { color:var(--bad); }
  /* frequency pads: drop an aircraft on one to hand it off */
  /* frequency pads: only while an aircraft is being dragged */
  #pads { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:none; gap:6px; z-index:2; pointer-events:none; }
  #pads.show { display:flex; }
  .pad { pointer-events:auto; min-width:70px; padding:10px; border:1px solid #333; border-radius:6px; background:rgba(0,0,0,.85);
         text-align:center; font:600 12px var(--mono); color:#aaa; transition:transform .08s, background .08s; }
  .pad small { display:none; }
  .pad.ai::after { content:' AI'; color:#666; font-weight:400; }
  #toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:3; pointer-events:none; max-width:min(720px, 92%);
           background:rgba(0,0,0,.8); border-radius:4px; padding:6px 10px; font:12px var(--mono); color:#ddd; display:none; text-align:center; }
  #toast.err { color:var(--bad); }
  #toast.ok { color:var(--ok); }
  /* tap menu: the commands for the tapped aircraft, with submenus */
  #pop { position:absolute; z-index:4; width:210px; max-height:calc(100% - 20px); overflow:auto; display:none; padding:4px 0;
         background:rgba(28,28,30,.97); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.5); font-size:13px; }
  #pop .hd { display:flex; align-items:center; gap:6px; padding:4px 6px 4px 12px; position:sticky; top:0; background:inherit; }
  #pop .hd b { font:600 12px var(--mono); flex:1; color:var(--dim); }
  #pop .hd span { display:none; }
  #pop .hd button { background:none; border:0; color:var(--dim); padding:2px 6px; }
  #pop .hd button:hover { color:var(--fg); }
  #pop .it { display:flex; align-items:center; gap:8px; padding:7px 12px; cursor:pointer; }
  #pop .it:first-of-type { border-top:0; }
  #pop .it:hover, #pop .it:active { background:var(--soft); }
  #pop .it span { flex:none; }
  #pop .it span:first-child { flex:1; }
  #pop .it .sub { color:var(--dim); }
  #pop .it.reply { color:var(--ok); font-weight:600; }
  #pop .it.warn { color:var(--bad); }
  #pop .it .val { font:12px var(--mono); color:var(--dim); }
  #pop .note { padding:8px 12px; color:var(--dim); }
  #viewbtns { position:absolute; left:8px; bottom:8px; z-index:2; display:flex; }
  #viewbtns button { background:none; border:0; color:#555; font:11px var(--mono); padding:4px 6px; }
  #viewbtns button.on, #viewbtns button:hover { color:#bbb; background:none; }
  /* modal */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:10; }
  #modal.hide { display:none; }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:20px 22px; width:min(420px, 94vw); max-height:92vh; overflow:auto;
          font-size:14px; line-height:1.45; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .card h2 { margin:0 0 4px; font-size:20px; }
  .card h4 { margin:16px 0 6px; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { display:flex; gap:6px; align-items:center; padding:6px 10px; background:var(--alt); border-radius:5px; cursor:pointer; }
  .opt input { margin:0; }
  .card table { border-collapse:collapse; width:100%; font-size:13px; }
  .card td { padding:4px 6px; border-top:1px solid var(--soft); vertical-align:top; }
  .card td:first-child { white-space:nowrap; color:var(--fg); font-weight:600; width:38%; }
  .card .foot { display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  #summary { width:min(600px, 94vw); }
  /* home page: pick the facility and the frequencies you work */
  #home { position:fixed; inset:0; z-index:9; background:var(--bg); overflow:auto; display:flex; justify-content:center; align-items:flex-start;
          padding:max(48px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
          font-size:14px; line-height:1.45; }
  #home.hide { display:none; }
  .hm { width:min(460px, 100%); }
  #home h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.01em; }
  #home h4 { margin:22px 0 8px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .fac { border-radius:8px; background:var(--alt); margin-bottom:8px; overflow:hidden; }
  .fhd { display:flex; flex-direction:column; padding:12px 14px; cursor:pointer; }
  .fhd b { font-size:15px; }
  .fac.on { background:var(--card); box-shadow:inset 0 0 0 1px var(--rule); }
  .frs { display:flex; gap:8px; padding:0 14px 12px; }
  .fr { flex:1; display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:6px; background:var(--bg); cursor:pointer; color:var(--dim); }
  .fr input { display:none; }
  .fr i { margin-left:auto; font:normal 12px var(--mono); color:var(--dim); }
  .fr:has(input:checked) { background:#203a5c; color:var(--fg); }
  .fr:has(input:checked) i { color:#9cc4ff; }
  #you { margin-top:22px; min-height:1.45em; }
  #home .foot { display:flex; align-items:center; gap:8px; margin-top:12px; }
  #home .foot button.primary, #home .foot button.g { padding:9px 18px; font-size:14px; }
  #backBtn { display:none; }
  #home.running #backBtn { display:inline-block; }
  #logBtn { display:none; }
  @media (max-width: 860px) and (min-height: 501px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 62svh auto; height:auto; overflow:auto; }
    header { grid-column:1; }
    #side { border-left:0; border-top:1px solid var(--line); }
    #log { flex:none; height:40svh; }
    .pad { min-width:58px; padding:7px 6px; }
  }
  /* phone in landscape: the scope gets the whole screen; calls float on it, the log slides in from the right */
  @media (max-height: 500px) and (orientation: landscape) {
    body { grid-template-columns: 1fr; }
    header { grid-column:1; padding:2px max(8px, env(safe-area-inset-right)) 2px max(8px, env(safe-area-inset-left)); }
    button.q { padding:7px 11px; font-size:14px; }
    #logBtn { display:inline-block; }
    #side { position:fixed; right:0; top:var(--hh, 38px); bottom:0; width:min(300px, 46vw); z-index:3; border:0; pointer-events:none;
            padding-right:env(safe-area-inset-right); }
    #calls { pointer-events:auto; max-height:45%; margin:6px 6px 0 0; border:0; border-radius:6px; background:rgba(28,28,30,.88); }
    .call { padding:8px 10px; }
    #log { display:none; }
    body.logOpen #side { pointer-events:auto; background:rgba(28,28,30,.97); border-left:1px solid var(--line); }
    body.logOpen #calls { margin:0; border-radius:0; background:none; border-bottom:1px solid var(--line); }
    body.logOpen #log { display:block; }
    #viewbtns { left:max(8px, env(safe-area-inset-left)); bottom:max(6px, env(safe-area-inset-bottom)); }
    #viewbtns button { padding:8px 9px; font-size:12px; }
    #pads { bottom:max(10px, env(safe-area-inset-bottom)); }
    .pad { min-width:60px; padding:10px 6px; }
    #pop .it { padding:9px 12px; }
    .card { padding:12px 16px; max-height:96dvh; }
    .card h2 { font-size:17px; } .card h4 { margin:8px 0 4px; }
    .card .foot { margin-top:10px; }
    #home { padding-top:max(16px, env(safe-area-inset-top)); align-items:center; }
    .hm { width:min(780px, 100%); display:grid; grid-template-columns:1.2fr 1fr; gap:28px; }
    #home h4 { margin:12px 0 6px; } #home h1 { font-size:20px; }
    .fhd { padding:9px 12px; } .frs { padding:0 12px 10px; }
    #you { margin-top:14px; }
  }
</style>
</head>
<body>
<header>
  <span id="clock">--:--</span>
  <button class="q" id="playBtn" title="Pause (space)">❚❚</button>
  <button class="q" id="spdBtn" title="Speed (1–5)">1×</button>
  <span id="score"></span>
  <button class="q" id="logBtn" title="Radio log">Log</button>
  <button class="q" id="help" title="How to play">?</button>
  <button class="q" id="newBtn">New</button>
</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="viewbtns"><button data-v="air" class="on">AIR</button><button data-v="term">FIN</button><button data-v="field">FLD</button><button data-v="gnd">GND</button></div>
  <div id="toast"></div>
  <div id="pop" role="menu"></div>
  <div id="pads"></div>
</div>
<div id="side">
  <div id="calls"></div>
  <div id="log"></div>
</div>

<div id="home">
  <div class="hm">
    <div class="col">
      <h1>atcscope</h1>
      <div class="muted">San Francisco (KSFO) · West plan. The AI works every frequency you don't.</div>
      <h4>Facility</h4>
      <div id="posOpts">
        <div class="fac" data-fac="tracon">
          <div class="fhd"><b>NorCal Approach</b><span class="muted">TRACON · arrivals and departures</span></div>
          <div class="frs">
            <label class="fr"><input type="checkbox" value="approach"><span>Approach</span><i data-f="approach"></i></label>
            <label class="fr"><input type="checkbox" value="departure"><span>Departure</span><i data-f="departure"></i></label>
          </div>
        </div>
        <div class="fac" data-fac="atct">
          <div class="fhd"><b>San Francisco Tower</b><span class="muted">ATCT · runways and taxiways</span></div>
          <div class="frs">
            <label class="fr"><input type="checkbox" value="tower"><span>Tower</span><i data-f="tower"></i></label>
            <label class="fr"><input type="checkbox" value="ground"><span>Ground</span><i data-f="ground"></i></label>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <h4>Traffic</h4>
      <div class="opts">
        <label class="opt"><input type="radio" name="lvl" value="light" checked> Light</label>
        <label class="opt"><input type="radio" name="lvl" value="medium"> Medium</label>
        <label class="opt"><input type="radio" name="lvl" value="peak"> Peak</label>
      </div>
      <h4>Length</h4>
      <div class="opts">
        <label class="opt"><input type="radio" name="min" value="20"> 20 min</label>
        <label class="opt"><input type="radio" name="min" value="40" checked> 40 min</label>
        <label class="opt"><input type="radio" name="min" value="60"> 60 min</label>
      </div>
      <div id="you" class="muted"></div>
      <div class="foot"><button class="q" id="howBtn">How to play</button><span style="flex:1"></span>
        <button class="g" id="backBtn">Back</button><button class="primary" id="startBtn">Start</button></div>
    </div>
  </div>
</div>

<div id="modal" class="hide">
  <div class="card" id="summary"></div>
</div>

  if (box.childElementCount !== want.length) box.innerHTML = want.map(f => `<div class="pad" data-f="${f}">${({ ground:'GND', tower:'TWR', approach:'APP', departure:'DEP', center:'CTR' })[f]}<small>${W.freqs[f]}</small></div>`).join('');
  for (const el of box.children) { el.classList.toggle('ai', el.dataset.f !== 'center' && !S.human.includes(el.dataset.f)); el.style.borderColor = FREQCOL[el.dataset.f] + '66'; }
}
let toastTimer = null;
function toast(text, kind) {
  const t = $('toast'); t.textContent = text; t.className = kind || ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', kind === 'err' ? 4000 : 2500);
}
function showPreview(text) { const t = $('toast'); t.textContent = text; t.className = ''; t.style.display = text ? 'block' : 'none'; clearTimeout(toastTimer); }
function hidePreview() { $('toast').style.display = 'none'; }

// ------------------------------------------------------------------ frame
function frame() {
  if (W) {
    const kk = k();
    ctx.fillStyle = SCOPE.bg; ctx.fillRect(0, 0, c.width, c.height);
    drawWorld(kk);
    if (S && S.running) { drawSelected(); drawAircraft(); drawDrag(); }
  }
  requestAnimationFrame(frame);
}
function resize() { const r = c.parentElement.getBoundingClientRect(); c.width = r.width * dpr(); c.height = r.height * dpr();
  document.body.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px'); }
window.addEventListener('resize', resize);

// ------------------------------------------------------------------ start / end
const HOWTO = `<h4>How to play</h4><table>
<tr><td>Tap an aircraft</td><td>Its command menu. If it's calling, the routine reply is on top (radar contact / expect the approach, pushback, taxi, cleared to land…); below are Altitude, Speed, Turn, Direct, Approach and Handoff submenus and the position's other instructions. Calls also list on the right; tap there too.</td></tr>
<tr><td>Drag an aircraft into open sky</td><td>Turn to that heading (Approach / Departure).</td></tr>
<tr><td>Drag onto a fix on its route</td><td>Proceed direct.</td></tr>
<tr><td>Drag onto an extended final</td><td>Cleared for the approach. From vectors, the drag's direction is the intercept heading (keep it within 30° of the final course) and it keeps its altitude until established.</td></tr>
<tr><td>Drag the altitude / speed up or down</td><td>Press on the altitude (or the speed) in the data block and slide up to climb / speed up, down to descend / slow: 1,000 ft or 10 kt per notch.</td></tr>
<tr><td>Drag onto a frequency pad</td><td>Hand off: Approach → Tower before the final approach fix, Tower → Departure once airborne, Departure → Center near the edge.</td></tr>
<tr><td>Tower: drag onto the runway</td><td>Arrival: cleared to land. Departure: near the threshold = line up and wait, further along = cleared for takeoff. Landing roll: drag to a side to exit that way.</td></tr>
<tr><td>Ground: drag to a runway end</td><td>Taxi to 01L / 01R; drag along taxiways to give the route. Arrivals: drag anywhere to taxi to parking. Drag across a runway to cross it; onto another aircraft to follow it.</td></tr>
<tr><td>Press and hold</td><td>Marking menu (or right-click): hold, 360s, resume the STAR, go around, divert, hold position… slide to one and let go.</td></tr>
<tr><td>Pan / zoom</td><td>Drag empty scope, scroll or pinch. Space pauses, 1–5 set the speed.</td></tr>
</table>`;

let summaryShown = false;
function openStart() { $('modal').classList.add('hide'); $('home').classList.toggle('running', !!(S && S.running && !S.over)); $('home').classList.remove('hide'); renderHome(); }
function renderHome() {
  const ticked = [...document.querySelectorAll('#posOpts input:checked')];
  document.querySelectorAll('.fac').forEach(f => f.classList.toggle('on', !!f.querySelector('input:checked')));
  if (W) document.querySelectorAll('.fr i').forEach(i => i.textContent = W.freqs[i.dataset.f]);
  $('you').textContent = ticked.length ? 'You work ' + ticked.map(i => i.nextElementSibling.textContent + (W ? ' ' + W.freqs[i.value] : '')).join(', ') : 'Pick a facility.';
  $('startBtn').disabled = !ticked.length;
}
// a facility turns all its frequencies on or off; each frequency also toggles on its own
document.querySelectorAll('.fhd').forEach(h => h.onclick = () => {
  const ins = [...h.parentElement.querySelectorAll('input')], on = ins.some(i => i.checked);
  ins.forEach(i => i.checked = !on); renderHome(); });
document.querySelectorAll('#posOpts input').forEach(i => i.onchange = renderHome);
$('backBtn').onclick = () => $('home').classList.add('hide');
$('howBtn').onclick = () => $('help').onclick();
$('newBtn').onclick = () => { if (S && S.running && !S.paused && !S.over) setSpeed(0); openStart(); };
$('help').onclick = () => { $('summary').style.display = 'block';
  $('summary').innerHTML = `<h2>How to play</h2>${HOWTO}<div class="foot"><span></span><button class="primary" id="closeHelp">Back to the scope</button></div>`;
  $('modal').classList.remove('hide'); $('closeHelp').onclick = () => $('modal').classList.add('hide'); };
$('modal').style.zIndex = 11;
$('startBtn').onclick = async () => {
  const positions = [...document.querySelectorAll('#posOpts input:checked')].map(i => i.value);
  if (!positions.length) return;
  const level = document.querySelector('input[name=lvl]:checked').value, minutes = Number(document.querySelector('input[name=min]:checked').value);
  try { localStorage.setItem('atcscope-setup', JSON.stringify({ positions, level, minutes })); } catch (e) {}
  logN = 0; $('log').innerHTML = ''; hist.clear(); sel = null; summaryShown = false;
  const r = await post('/api/new', { positions, level, minutes });
  document.title = `atcscope · ${r.info.level} · seed ${r.info.seed}`;
  $('home').classList.add('hide');
  view = positions.includes('approach') || positions.includes('departure') ? { ...presets.air } : positions.includes('tower') ? { ...presets.field } : { ...presets.gnd };
  poll(true);
};
try { const s = JSON.parse(localStorage.getItem('atcscope-setup') || 'null');
  if (s) { document.querySelectorAll('#posOpts input').forEach(i => i.checked = s.positions.includes(i.value));
    document.querySelectorAll('input[name=lvl]').forEach(i => i.checked = i.value === s.level);
    document.querySelectorAll('input[name=min]').forEach(i => i.checked = Number(i.value) === s.minutes); } } catch (e) {}
function showSummary() {
  summaryShown = true;
  const sc = S.score, rules = Object.entries(sc.by_rule).sort((a, b) => b[1] - a[1]).map(([r, n]) => `${esc(r)} ×${n}`).join(', ') || 'none';
  $('summary').innerHTML = `<h2>Session over</h2>
    <div class="muted">${esc(S.info.level)} traffic · seed ${S.info.seed} · you worked ${S.human.join(', ')}</div>
    <h4>Score (lower is better, same scoring as atc-at-home)</h4>
    <table><tr><td>Cost</td><td><b>${sc.cost}</b></td></tr>
    <tr><td>Hard violations</td><td>${sc.hard} <span class="muted">(100 each: separation, runway incursions, terrain, unworked Mayday)</span></td></tr>
    <tr><td>Rule violations</td><td>${sc.rule} <span class="muted">(10 each)</span></td></tr>
    <tr><td>Service</td><td>${sc.service} <span class="muted">(2 each)</span></td></tr>
    <tr><td>Go-arounds</td><td>${sc.go_arounds}</td></tr>
    <tr><td>Delay</td><td>${sc.delay_min} min <span class="muted">(arrivals ${sc.arr_delay_min}, departures ${sc.dep_delay_min}, unanswered calls ${sc.request_wait_min})</span></td></tr>
    <tr><td>Movements</td><td>${S.landed} landed, ${S.departed} departed${sc.diverted ? `, ${sc.diverted} diverted` : ''}</td></tr>
    <tr><td>By paragraph</td><td>${rules}</td></tr></table>
    <div class="foot"><button class="g" id="sumClose">Look at the scope</button><button class="primary" id="sumNew">New session</button></div>`;
  $('summary').style.display = 'block'; $('modal').classList.remove('hide');
  $('sumClose').onclick = () => $('modal').classList.add('hide');
  $('sumNew').onclick = openStart;
}

(async () => {
  W = await (await fetch('/world.json')).json();
  resize(); requestAnimationFrame(frame);
  await poll(true);
  renderHome();
  if (S && S.running && !S.over) { $('home').classList.add('hide'); document.title = `atcscope · ${S.info.level} · seed ${S.info.seed}`;
  }
  setInterval(poll, 250);
})();
</script>
</body>
</html>
