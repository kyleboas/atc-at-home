# Scores every pull request on the training scenarios. Runs the submitted code with a
# read-only token and no secrets (pull_request, not pull_request_target), so fork code
# cannot write to the repo or read anything private.
#
# Pull requests opened by the repository owner may change any file (tooling, the replay viewer,
# docs); they are scored only when they change controller.py.
name: evaluate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Submissions may only change controller.py
        if: github.event.pull_request.user.login != github.repository_owner
        run: |
          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD)
          echo "$changed"
          bad=$(printf '%s\n' "$changed" | grep -v '^controller.py$' || true)
          if [ -n "$bad" ]; then
            echo "::error::A submission may only change controller.py. Also changed:"; echo "$bad"; exit 1
          fi
      - name: Does it change controller.py?
        id: changes
        run: |
          if git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD | grep -qx 'controller.py'; then
            echo "controller=true" >> "$GITHUB_OUTPUT"
          else
            echo "controller=false" >> "$GITHUB_OUTPUT"
            echo "No change to controller.py: nothing to score." | tee -a "$GITHUB_STEP_SUMMARY" > skipped.txt
          fi
      - name: Controller uses only what a controller may (tools/ci_guard.py)
        if: steps.changes.outputs.controller == 'true'
        run: python tools/ci_guard.py controller.py
      - name: Score on the training scenarios
        if: steps.changes.outputs.controller == 'true'
        run: python tools/ci_score.py --out result.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Record the pull request number for the comment job
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atc-result
          path: |
            result.json
            pr_number.txt
            skipped.txt
